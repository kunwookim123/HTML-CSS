    <!-- Promise -->
    <!-- Promise는 비동기 작업의 최종 완료 또는 실패를 나타내는 객체 -->
    <script>
        // getData(function(a) {

        // Promise로 해결

        // promise 생성
        const promise = new Promise((resolve, reject) => {
            // 비동기 작업
            
            if ("성공") {
                resolve("결과");
            } else {
                reject("에러");
            }
        });

        const successPromise = new Promise((resolve, reject) => {
            setTimeout(() => {
                resolve("데이터를 성공적으로 가져 왔습니다.")
            }, 1000);
        });

        successPromise.then((result) => {
            console.log(result);
        });

        const failPromise = new Promise((resolve, reject) => {
            setTimeout(() => {
                reject("데이터를 가져오지 못했습니다.")
            }, 1000);
        });

        failPromise.then((result) => {
            console.log(result);
        });

        // .then() 성공 처리
        // promise.then(successCallBack, failCallBack)

        // 보통 성공만 처리
        // promise.then((result) => {
        //     console.log(result);
        // });

        // .catch() - 실패처리
        // promise.catch(error => {
        //    console.log(error)
        // })

        const fetchData = new Promise((resolve, reject) => {
            setTimeout(() => {
                reject(new Error("네트워크 에러 발생!!!"));
            }, 1000);
        });

        fetchData
            .then((data) => {
                console.log(data);
            })
            .catch((error) => {
                console.log("에러 발생", error.message);
            })
            .finally(() => {
                console.log("무조건 실행");
            });

        // Promise 체이닝

        Promise.resolve(10)
        .then((num) => {
            console.log(num);
            return num * 2;
        })
        .then((num) => {
            console.log(num);
            return num + 5;
        })
        .then((num) => {
            console.log(num);
        });

        // Promise.all() - 모두 성공

        })
        .catch((error) => {
            console.error("하나라도 실패하면 실패");
        });

        const fetchPost = Promise.resolve({title: "제목"});

        Promise.all([fetchUser, fetchPost, fetchComments]).thne((results) => {

        })
