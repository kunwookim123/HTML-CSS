<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨 앱</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f7f6;
        }

        /* 중앙 정렬 및 최대 너비 설정 */
        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #city-input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #search-button {
            padding: 10px 15px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        /* 로딩, 에러, 날씨 정보를 기본적으로 숨깁니다. */
        .loading, .error-message, .weather-info { 
            display: none; 
            padding: 15px; 
            margin-top: 15px;
            border-radius: 8px;
        }

        /* .show 클래스가 있을 때만 보이게 합니다. */
        .loading.show, .error-message.show, .weather-info.show { 
            display: block; 
        }

        /* 로딩 스타일 */
        .loading {
            background-color: #e9ecef;
            text-align: center;
        }

        /* 에러 스타일 */
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* 🚨 날씨 정보 박스 스타일 (네모 박스 크기 조절) */
        .weather-info {
            background-color: white;
            border: 1px solid #007bff;
            /* 최대 너비를 400px로 제한하고 중앙 정렬 */
            max-width: 400px; 
            margin: 15px auto; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .weather-main {
            display: flex;
            align-items: center;
            justify-content: space-around;
            margin: 20px 0;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        #temperature {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
        }

        #weather-icon {
            width: 80px;
            height: 80px;
        }

        .details-grid > div {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-top: 1px dashed #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>날씨 앱</h1>

        <div class="search-container">
            <input
                type="text"
                id="city-input"
                placeholder="도시 이름을 입력하세요 (예 서울, Busan)"
            />
            <button id="search-button">검색</button>
        </div>

        <div id="loading" class="loading">
            

[Image of a spinning loading icon]

            <p>날씨 정보를 불러오는 중...</p>
        </div>

        <div id="error-message" class="error-message"></div>

        <div id="weather-info" class="weather-info">
            <div class="current-weather">
                <div class="location">
                    <h2 id="city-name">도시 이름</h2>
                    <p id="country-name">지역 이름</p>
                </div>
            </div>
            
            <div class="weather-main">
                <img id="weather-icon" src="" alt="날씨 아이콘" />
                <div id="temperature"></div>
            </div>

            <div class="details-grid">
                <div>
                    <span>체감 온도:</span>
                    <span><span id="feels-like-temp"></span> °C</span>
                </div>

                <div>
                    <span>습도:</span>
                    <span><span id="humidity"></span> %</span>
                </div>

                <div>
                    <span>풍속:</span>
                    <span><span id="wind-speed"></span> m/s</span>
                </div>

                <div>
                    <span>기압:</span>
                    <span><span id="pressure"></span> hPa</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 🚨 중요: YOUR_API_KEY_HERE 부분을 본인의 실제 OpenWeatherMap API 키로 교체하세요.
        const API_KEY = "4652873c5a18e270af22dc74ea88029e";
        const BASE_URL = "https://api.openweathermap.org/data/2.5/weather";

        // 1. HTML 요소 선택
        const cityInput = document.getElementById('city-input');
        const searchButton = document.getElementById('search-button');
        const loadingDiv = document.getElementById('loading');
        const errorDiv = document.getElementById('error-message');
        const weatherInfoDiv = document.getElementById('weather-info');

        const cityNameH2 = document.getElementById('city-name');
        const countryNameP = document.getElementById('country-name');
        const weatherIconImg = document.getElementById('weather-icon');
        const temperatureDiv = document.getElementById('temperature');
        const feelsLikeSpan = document.getElementById('feels-like-temp');
        const humiditySpan = document.getElementById('humidity');
        const windSpeedSpan = document.getElementById('wind-speed');
        const pressureSpan = document.getElementById('pressure');

        // 2. 헬퍼 함수: 로딩 상태 표시/숨기기
        function toggleLoading(show) {
            loadingDiv.classList.toggle('show', show);
            // 로딩 중일 때는 다른 모든 것을 숨깁니다.
            weatherInfoDiv.classList.remove('show');
            errorDiv.classList.remove('show');
        }

        // 3. 헬퍼 함수: 에러 메시지 표시
        function displayError(message) {
            errorDiv.textContent = '오류: ' + message;
            errorDiv.classList.add('show');
            // 에러가 발생했으므로 로딩과 날씨 정보는 숨깁니다.
            weatherInfoDiv.classList.remove('show');
            loadingDiv.classList.remove('show');
        }

        // 4. API를 호출하고 데이터를 처리하는 메인 함수
        async function fetchWeather(city) {
            const trimmedCity = city.trim();
            if (!trimmedCity) {
                displayError('도시 이름을 입력해 주세요.');
                return;
            }

            // 1. 로딩 화면 표시 및 기존 정보 숨기기
            toggleLoading(true);

            // 💡 [최종 수정 로직] 단일 도시 이름 검색 시 ",kr"을 추가하여 정확도를 높임
            let searchQuery = trimmedCity;
            
            if (!trimmedCity.includes(',')) {
                // 콤마가 없는 단일 도시 이름이라면, ",kr"을 자동으로 추가
                searchQuery = trimmedCity + ',kr';
            } 
            
            const encodedQuery = encodeURIComponent(searchQuery); 
            
            // 최종 URL 구성
            const url = `${BASE_URL}?q=${encodedQuery}&appid=${API_KEY}&units=metric&lang=kr`;

            try {
                const response = await fetch(url);

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || '날씨 정보를 가져오는 데 실패했습니다. 도시 이름을 확인해 주세요.');
                }

                const data = await response.json();
                
                // 3. 성공 후 로딩 화면 숨기기 및 날씨 정보 표시
                toggleLoading(false);
                displayWeather(data);

            } catch (error) {
                // 4. 오류 발생 시 로딩 화면 숨기기 및 에러 메시지 표시
                displayError(error.message);
                console.error("날씨 정보 호출 중 오류 발생:", error);
            }
        }

        // 5. DOM에 날씨 정보를 렌더링하는 함수 (구름 양 분류 적용)
        function displayWeather(data) {
            // 날씨 정보 추출
            const temp = Math.round(data.main.temp); 
            const feelsLike = Math.round(data.main.feels_like); 
            const humidity = data.main.humidity; 
            const windSpeed = data.wind.speed; 
            const pressure = data.main.pressure;
            const iconCode = data.weather[0].icon; 
            
            // 💡 [구름 양 분류 로직 적용]
            const cloudPercentage = data.clouds.all;
            let description;

            if (cloudPercentage >= 51) {
                // 51% 이상: 흐림 (Broken Clouds, Overcast Clouds 포함)
                description = '흐림';
            } else if (cloudPercentage >= 1) {
                // 1% ~ 50% 사이: 구름 많음 (Few Clouds, Scattered Clouds 포함)
                description = '구름 많음';
            } else {
                // 0%: 맑음 (Clear sky)
                description = '맑음';
            }
            
            // 날씨 아이콘 URL
            const iconUrl = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;

            // HTML 요소에 데이터 삽입
            cityNameH2.textContent = data.name;
            countryNameP.textContent = data.sys.country;
            
            // 온도와 함께 변경된 description 사용
            temperatureDiv.textContent = `${temp}°C / ${description}`;

            weatherIconImg.src = iconUrl;
            weatherIconImg.alt = data.weather[0].description; // alt 태그는 원래 값 유지
            
            feelsLikeSpan.textContent = feelsLike;
            humiditySpan.textContent = humidity;
            windSpeedSpan.textContent = windSpeed;
            pressureSpan.textContent = pressure;

            weatherInfoDiv.classList.add('show'); // 날씨 정보 섹션 표시
        }

        // 6. 이벤트 리스너 설정
        const handleSearch = () => {
            const city = cityInput.value.trim();
            fetchWeather(city);
        };
        
        searchButton.addEventListener('click', handleSearch);

        cityInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                handleSearch();
            }
        });
        
        // 초기 로딩 시 서울 날씨를 가져옴
        fetchWeather('Seoul');
    </script>
</body>
</html>
