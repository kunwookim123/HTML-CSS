<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>영화 검색 홈페이지</title>
    <style>
        /* 1. 기본 및 레이아웃 스타일 */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
            color: #333;
        }
        /* 💡 [수정/유지] 모달 열릴 때 body 스크롤 방지 */
        body.modal-open {
            overflow: hidden;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1, h2 {
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
            margin-top: 30px;
        }

        /* 2. 검색 섹션 스타일 */
        .search-container {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
        }
        #search-input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #search-button {
            padding: 10px 15px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #search-button:hover {
            background-color: #0056b3;
        }

        /* 3. 로딩/에러 스타일 */
        .loading, .error {
            display: none;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }
        .loading { background-color: #e6f7ff; color: #007bff; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .loading.show, .error.show { display: block; }

        /* 4. 영화 목록 컨테이너 (가로 스크롤) 스타일 */
        .horizontal-scroll-container {
            display: flex;
            overflow-x: scroll;
            padding: 10px 0;
            gap: 15px;
            scroll-behavior: smooth;

            /* 스크롤바 숨기기 (선택 사항) */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .horizontal-scroll-container::-webkit-scrollbar {
            display: none;
        }

        /* 5. 영화 카드 (가로 스크롤용 크기) 스타일 */
        .movie-card-scroll {
            min-width: 180px;
            max-width: 180px;
            flex-shrink: 0;
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.2s;
            padding-bottom: 5px;
            cursor: pointer;
        }
        .movie-card-scroll:hover {
            transform: translateY(-5px);
        }

        .movie-card-scroll img {
            width: 100%;
            height: 270px;
            object-fit: cover;
            display: block;
        }

        .movie-card-scroll h3 {
            font-size: 1em;
            margin: 5px 0 0;
            padding: 0 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-card-scroll p { font-size: 0.8em; color: #555; margin-bottom: 5px; }

        /* 6. 스크롤 래퍼 및 버튼 스타일 */
        .scroll-wrapper {
            position: relative;
            overflow: hidden;
        }

        .scroll-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 15px 10px;
            font-size: 24px;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
            height: 100px;
            margin: 0 5px;
        }

        .scroll-btn:hover {
            opacity: 1;
        }

        .left-btn {
            left: 0;
            border-radius: 0 5px 5px 0;
        }

        .right-btn {
            right: 0;
            border-radius: 5px 0 0 5px;
        }

        /* 7. 상세 정보 모달 스타일 (수정 및 추가) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 30px;
            border: 1px solid #888;
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-height: 90vh;
            overflow-y: auto;
            /* 💡 [유지] 모달 내용물이 flex로 정렬되도록 */
            display: flex;
            flex-direction: column;
        }

        .close-btn {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            position: absolute;
            top: 15px;
            right: 25px;
        }

        .close-btn:hover,
        .close-btn:focus {
            color: #333;
            text-decoration: none;
        }

        /* 💡 [유지] 모달 내 포스터와 텍스트 정보 컨테이너 */
        .poster-and-info {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: flex-start;
        }
        .details-poster {
            width: 150px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }
        .text-info {
            flex-grow: 1;
        }
        .text-info h2 {
            margin-top: 0;
            font-size: 2em;
            color: #007bff;
            border-bottom: none;
            padding-bottom: 0;
        }
        .text-info p {
            font-size: 1em;
            margin: 5px 0;
        }

        .cast-info {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .cast-info strong {
            color: #333;
            display: block;
            margin-bottom: 5px;
        }

        #details-overview {
            line-height: 1.6;
            margin-top: 10px;
        }

        #details-content h3 {
             border-bottom: 2px solid #ddd;
             padding-bottom: 5px;
             margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>영화 검색</h1>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="영화 제목을 입력하세요." />
            <button id="search-button">검색</button>
        </div>

        <div id="loading" class="loading">
            

[Image of a spinning loading icon]

            <p>영화 정보를 불러오는 중...</p>
        </div>
        <div id="status-message" class="error"></div>

        <div>
            <h2 id="list-title">인기 영화 목록</h2>

            <div id="movie-list-wrapper" class="scroll-wrapper">
                <button class="scroll-btn left-btn" data-direction="left">‹</button>

                <div id="movie-list" class="horizontal-scroll-container">
                    </div>

                <button class="scroll-btn right-btn" data-direction="right">›</button>
            </div>
        </div>
    </div>

    <div id="details-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="details-content">
                <div class="poster-and-info">
                    <img id="details-poster" src="" alt="영화 포스터" class="details-poster">
                    <div class="text-info">
                        <h2></h2>
                        <p><strong>개봉일:</strong> <span id="details-release-date"></span></p>
                        <p><strong>평점:</strong> <span id="details-rating"></span></p>
                    </div>
                </div>

                <div class="cast-info">
                    <strong>감독:</strong> <span id="details-director"></span>
                    <br>
                    <strong>주요 출연진:</strong> <span id="details-cast"></span>
                </div>

                <h3>영화 개요</h3>
                <p id="details-overview"></p>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = "https://api.themoviedb.org/3";
        const API_KEY = "d40653d9f45c0c0a68900733a9c2b6e7";
        const IMG_BASE = "https://image.tmdb.org/t/p";
        const POSTER_SIZE = "/w500";
        const CARD_POSTER_SIZE = "/w200";
        const MODAL_POSTER_SIZE = "/w300";
        const DEFAULT_POSTER = "https://via.placeholder.com/200x300?text=No+Image";

        // 1. HTML 요소 선택
        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        const movieListDiv = document.getElementById('movie-list');
        const movieListWrapper = document.getElementById('movie-list-wrapper');
        const listTitle = document.getElementById('list-title');
        const statusMessageDiv = document.getElementById('status-message');
        const loadingDiv = document.getElementById('loading');

        const detailsModal = document.getElementById('details-modal');
        const closeBtn = document.querySelector('.close-btn');

        const detailsPoster = document.getElementById('details-poster');
        const detailsTitle = document.querySelector('#details-content .text-info h2');
        const detailsReleaseDate = document.getElementById('details-release-date');
        const detailsRating = document.getElementById('details-rating');
        const detailsDirector = document.getElementById('details-director');
        const detailsCast = document.getElementById('details-cast');
        const detailsOverview = document.getElementById('details-overview');


        // 2. 헬퍼 함수: 상태 메시지/로딩 표시 제어
        function toggleLoading(show) {
            loadingDiv.classList.toggle('show', show);
            statusMessageDiv.classList.remove('show');
            if (show) {
                // 이 함수는 '전체 목록'을 로드할 때만 사용되므로, 목록을 비우는 것은 그대로 유지합니다.
                movieListDiv.innerHTML = '';
            }
        }

        function displayStatus(message, isError = false) {
            statusMessageDiv.textContent = message;
            statusMessageDiv.className = isError ? 'error show' : 'loading show';
            loadingDiv.classList.remove('show');
        }

        // 3. 영화 카드 렌더링 함수 (가로 스크롤용)
        function renderMovies(movies) {
            movieListDiv.innerHTML = '';

            if (movies.length === 0) {
                displayStatus('검색 결과가 없습니다.', false);
                return;
            }

            movies.forEach(movie => {
                const posterPath = movie.poster_path ? `${IMG_BASE}${CARD_POSTER_SIZE}${movie.poster_path}` : DEFAULT_POSTER;
                const releaseDate = movie.release_date || '날짜 미정';
                const rating = movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A';

                const card = document.createElement('div');
                card.className = 'movie-card-scroll';
                card.setAttribute('data-movie-id', movie.id);

                card.innerHTML = `
                    <img src="${posterPath}" alt="${movie.title} 포스터" />
                    <h3>${movie.title}</h3>
                    <p>평점: ${rating} / ${releaseDate.split('-')[0]}</p>
                `;

                card.addEventListener('click', () => fetchMovieDetails(movie.id));

                movieListDiv.appendChild(card);
            });

            setupScrollButtons();
        }

        // 4. 스크롤 버튼 기능 설정 함수
        function setupScrollButtons() {
            const scrollButtons = movieListWrapper.querySelectorAll('.scroll-btn');
            const scrollAmount = (180 + 15) * 4;

            scrollButtons.forEach(button => {
                button.onclick = null;

                button.onclick = () => {
                    const direction = button.dataset.direction;
                    let distance = direction === 'left' ? -scrollAmount : scrollAmount;

                    movieListDiv.scrollBy({
                        left: distance,
                        behavior: 'smooth'
                    });
                };
            });
        }

        // 5. 💡 [핵심 수정 적용] 상세 정보 및 크레딧 API 호출
        async function fetchMovieDetails(movieId) {
            // **이전 문제 해결: 여기서 toggleLoading(true)를 제거했습니다.**
            // 모달 정보 로딩은 메인 목록을 지우지 않습니다.

            const detailsUrl = `${BASE_URL}/movie/${movieId}?api_key=${API_KEY}&language=ko-KR`;
            const creditsUrl = `${BASE_URL}/movie/${movieId}/credits?api_key=${API_KEY}&language=ko-KR`;

            try {
                const [detailsResponse, creditsResponse] = await Promise.all([
                    fetch(detailsUrl),
                    fetch(creditsUrl)
                ]);

                if (!detailsResponse.ok || !creditsResponse.ok) {
                    throw new Error('상세 영화 정보를 가져오는 데 실패했습니다.');
                }

                const details = await detailsResponse.json();
                const credits = await creditsResponse.json();

                displayMovieDetails(details, credits);

            } catch (error) {
                 console.error('상세 정보 로드 오류:', error.message);
            }
        }

        // 6. 상세 정보 렌더링 및 모달 표시
        function displayMovieDetails(details, credits) {
            const director = credits.crew.find(member => member.job === 'Director');
            const directorName = director ? director.name : '정보 없음';

            const castNames = credits.cast
                .slice(0, 3)
                .map(actor => actor.name)
                .join(', ');

            const posterPath = details.poster_path ? `${IMG_BASE}${MODAL_POSTER_SIZE}${details.poster_path}` : DEFAULT_POSTER;

            detailsPoster.src = posterPath;
            detailsPoster.alt = `${details.title} 포스터`;
            detailsTitle.textContent = details.title;
            detailsReleaseDate.textContent = details.release_date || '정보 없음';
            detailsRating.textContent = `${details.vote_average ? details.vote_average.toFixed(1) : 'N/A'} / 10 (${details.vote_count}명)`;
            detailsDirector.textContent = directorName;
            detailsCast.textContent = castNames || '정보 없음';
            detailsOverview.textContent = details.overview || '제공된 개요가 없습니다.';

            detailsModal.style.display = "block";
            document.body.classList.add('modal-open');
        }

        // 7. 모달 닫기 이벤트 리스너 설정
        closeBtn.onclick = () => {
            detailsModal.style.display = "none";
            document.body.classList.remove('modal-open');
        };

        // 모달 외부 클릭 시 닫기
        window.onclick = (event) => {
            if (event.target == detailsModal) {
                detailsModal.style.display = "none";
                document.body.classList.remove('modal-open');
            }
        };


        // 8. 인기 영화 목록 불러오기
        async function getPopularMovies(page = 1) {
            listTitle.textContent = '인기 영화 목록';
            toggleLoading(true);

            const url = `${BASE_URL}/movie/popular?api_key=${API_KEY}&language=ko-KR&page=${page}`;

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('인기 영화 정보를 불러오는 데 실패했습니다.');
                }
                const data = await response.json();
                toggleLoading(false);
                renderMovies(data.results);

            } catch (error) {
                displayStatus(`오류: ${error.message}`, true);
            }
        }

        // 9. 영화 검색 함수
        async function searchMovies(query, page = 1) {
            if (!query) return;

            listTitle.textContent = `'${query}' 검색 결과`;
            toggleLoading(true);

            const encodedQuery = encodeURIComponent(query);

            const url = `${BASE_URL}/search/movie?api_key=${API_KEY}&language=ko-KR&query=${encodedQuery}&page=${page}`;

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('영화 검색에 실패했습니다.');
                }
                const data = await response.json();
                toggleLoading(false);
                renderMovies(data.results);

            } catch (error) {
                displayStatus(`오류: ${error.message}`, true);
            }
        }

        // 10. 이벤트 리스너 설정 및 초기화
        const handleSearch = () => {
            const query = searchInput.value.trim();
            if (query) {
                searchMovies(query);
            } else {
                getPopularMovies();
            }
        };

        searchButton.addEventListener('click', handleSearch);
        searchInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                handleSearch();
            }
        });

        // 앱 초기화: 인기 영화 목록 표시
        getPopularMovies();
    </script>
</body>
</html>
